<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask Hiro — demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f6fa; }
    </style>
  </head>
  <body>
    <button id="reopen" style="display:none;position:fixed;inset:auto 0 32px;margin:auto;width:max-content;align-items:center;gap:8px;padding:14px 22px;border:0;border-radius:999px;background:#218EE7;color:#fff;font:600 15px system-ui;box-shadow:0 8px 24px rgba(33,142,231,.35);cursor:pointer">Ask Hiro</button>
    <!--
      Stands in for the Hiro app's "Ask Hiro" screen. The app passes the signed-in
      user; here they come from the address:
        /sdk/hiro-demo.html?phone=…&uid=…&name=…   (optional: &id=<widget id>)
      Served next to the widget, so it uses this same studio for everything.
    -->
    <script>
      var q = new URLSearchParams(location.search)
      var origin = location.origin
      window.PairAiWidgetSettings = {
        beBaseUrl: origin,
        metadata: { phone: q.get('phone') || '', user_id: q.get('uid') || '', name: q.get('name') || '' },
      }
      ;(function (d, t) {
        var BASE_URL = origin + '/sdk'
        var g = d.createElement(t), s = d.getElementsByTagName(t)[0]
        g.src = BASE_URL + '/sdk.js'
        g.async = true
        s.parentNode.insertBefore(g, s)
        g.onload = function () {
          window.PairAiWidgetSDK.run({ widgetId: q.get('id') || 'HIRO_ASK', baseUrl: BASE_URL })
          // The app would leave the screen on close; the demo offers a way back.
          var reopen = d.getElementById('reopen')
          PairWidget.on('closed', function () { reopen.style.display = 'flex' })
          PairWidget.on('opened', function () { reopen.style.display = 'none' })
          reopen.onclick = function () { PairWidget.open() }
        }
      })(document, 'script')
    </script>
  </body>
</html>
