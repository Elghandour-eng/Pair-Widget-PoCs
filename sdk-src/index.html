<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-tsrouter-app" />
    <title>Create TanStack App - widget</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Initialize window.PairAiWidgetSettings if not already set
      if (!window.PairAiWidgetSettings) {
        window.PairAiWidgetSettings = {}
      }
      // Read beBaseUrl from URL parameters (passed by SDK)
      // This must happen BEFORE any modules load (including env.ts) because env.ts needs it immediately
      var urlParams = new URLSearchParams(window.location.search)
      var beBaseUrl = urlParams.get('beBaseUrl')
      if (beBaseUrl) {
        window.PairAiWidgetSettings.beBaseUrl = beBaseUrl
      }
      var userId = urlParams.get('userId')
      if (userId) {
        window.PairAiWidgetSettings.userId = userId
      }
      var transport = urlParams.get('transport')
      if (transport) {
        window.PairAiWidgetSettings.transport = transport
      }
      // Other settings (position, type, launcherTitle) will be set via postMessage in widget-ui-context.tsx
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
