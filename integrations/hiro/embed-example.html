<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask Hiro</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f6fa; }
    </style>
  </head>
  <body>
    <!--
      The Hiro app's "Ask Hiro" screen (a full-screen web view).
      The app knows who is signed in and passes it as metadata: the widget sends
      it with every message and the Hiro agent reads it as its inputs (the phone
      finds the user's body scans, the user id their favourites).
      No launcher: the design opens the chat full screen by itself.
    -->
    <script>
      window.PairAiWidgetSettings = {
        beBaseUrl: 'https://YOUR-STUDIO-HOST',
        metadata: { phone: 'USER_PHONE', user_id: 'USER_ID', name: 'FIRST_NAME' },
      }
      ;(function (d, t) {
        var BASE_URL = 'https://YOUR-STUDIO-HOST/sdk'
        var g = d.createElement(t), s = d.getElementsByTagName(t)[0]
        g.src = BASE_URL + '/sdk.js'
        g.async = true
        s.parentNode.insertBefore(g, s)
        g.onload = function () {
          window.PairAiWidgetSDK.run({ widgetId: 'HIRO_ASK', baseUrl: BASE_URL })
        }
      })(document, 'script')
      // If the user changes while the screen is open:
      // PairWidget.updateMetadata({ phone: '…', user_id: '…', name: '…' })
    </script>
  </body>
</html>
