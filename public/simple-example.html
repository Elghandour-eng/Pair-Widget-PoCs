<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pair AI Widget - Simple Example</title>
  </head>
  <body style="font-family: sans-serif; padding: 20px">
    <h2>BTQ Website/APP</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px">
      <button
        onclick="updateLocaleViaSDK('ar-kw')"
        style="padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer"
      >
        Update Locale to 'ar-kw' (via SDK)
      </button>
      <!-- <button
        onclick="updateLocaleViaPostMessage('ar-kw')"
        style="padding: 10px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer"
      >
        Update Locale to 'ar-kw' (via postMessage)
      </button> -->
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 20px">
      <button
        onclick="updateParamViaSDK()"
        style="padding: 10px 16px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer"
      >
        Update Param gender '4194' (via SDK)
      </button>
      <!-- <button
        onclick="updateParamViaPostMessage()"
        style="
          padding: 10px 16px;
          background: #ffc107;
          color: #212529;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Update Param gender '4194' (via postMessage)
      </button> -->
    </div>

    <!-- Load the actual widget -->
    <script>
      const newParam = {
        gender: '4194',
        app_version: '8.0.0',
        platform: 'web',
        deviceId: '1784117644116-60353',
        exp_list: {
          'exp-57226': 'New',
          'exp-55139': 'default',
          'exp-96160': 'default',
          'exp-36818': 'disabled',
          'exp-46098': 'A',
          'exp-18701': 'disabled',
          'exp-25877': 'Exp A',
        },
      }

      function updateParamViaSDK() {
        if (window.PairAiWidgetSDK) {
          console.log('[Test Page] Calling PairAiWidgetSDK.updateMetadata for param:', newParam)
          window.PairAiWidgetSDK.updateMetadata({ param: newParam })
        } else {
          alert('SDK not loaded yet!')
        }
      }

      function updateParamViaPostMessage() {
        const widgetIframe = document.getElementById('pair-ai-widget-iframe')
        if (widgetIframe && widgetIframe.contentWindow) {
          console.log('[Test Page] Sending postMessage metadata:update for param:', newParam)
          widgetIframe.contentWindow.postMessage(
            {
              type: 'metadata:update',
              data: { param: newParam },
            },
            '*',
          )
        } else {
          alert('Widget iframe not found!')
        }
      }

      function updateLocaleViaSDK(locale) {
        if (window.PairAiWidgetSDK) {
          console.log('[Test Page] Calling PairAiWidgetSDK.updateMetadata:', { locale })
          window.PairAiWidgetSDK.updateMetadata({ locale })
        } else {
          alert('SDK not loaded yet!')
        }
      }

      function updateLocaleViaPostMessage(locale) {
        const widgetIframe = document.getElementById('pair-ai-widget-iframe')
        if (widgetIframe && widgetIframe.contentWindow) {
          console.log('[Test Page] Sending postMessage metadata:update:', { locale })
          widgetIframe.contentWindow.postMessage(
            {
              type: 'metadata:update',
              data: { locale },
            },
            '*',
          )
        } else {
          alert('Widget iframe not found!')
        }
      }
      window.PairAiWidgetSettings = {
        position: 'left',
        type: 'standard',
        launcherTitle: 'Chat with us!',
        welcome_title_var: 'Sarah',
        openAutomatically: true,
        userId: '01HF7YAT00KEVN5G8KVF7WQ96G',
        accessToken: 'ACCESS_TOKEN',
        accessTokenExpiresIn: 32,
        refreshFn: async () => {
          // Retrieve the current token from your application
          const refreshToken = 'PASS_TOKEN_HERE'

          const response = await fetch('https://system.trypair.ai/v1/widget/01KZ0RE6RABAXZJR9CA9G1SDDN/config', {
            method: 'GET',
            // headers: {
            //   Authorization: `Bearer ${refreshToken}`,
            // },
          })

          if (!response.ok) {
            throw new Error('Failed to refresh token')
          }

          const data = await response.json()

          return {
            accessToken: 'UPDATED_ACCESS_TOKEN',
            accessTokenExpiresIn: 50,
          }
        },
        metadata: {
          param: {
            gender: '2741',
            app_version: '8.0.0',
            platform: 'web',
            deviceId: '1784117644116-60353',
            exp_list: {
              'exp-57226': 'New',
              'exp-55139': 'default',
              'exp-96160': 'default',
              'exp-36818': 'disabled',
              'exp-46098': 'A',
              'exp-18701': 'disabled',
              'exp-25877': 'Exp A',
            },
          },
          locale: 'en-kw',
        },
      }
      ;(function (d, t) {
        var BASE_URL = 'http://localhost:3000'
        var g = d.createElement(t),
          s = d.getElementsByTagName(t)[0]
        g.src = BASE_URL + '/sdk.js'
        g.async = true
        s.parentNode.insertBefore(g, s)
        g.onload = function () {
          window.PairAiWidgetSDK.run({
            // Boutiqaat Widget ID: '01KT8X452RMYR45GEWCCED5DAV',
            // Hiro Widget ID: '01KV5D4WSMW463XF1HQMV9GMM7',
            widgetId: '01KZ0RE6RABAXZJR9CA9G1SDDN',
            baseUrl: BASE_URL,
          })
        }
      })(document, 'script')
    </script>
  </body>
</html>
