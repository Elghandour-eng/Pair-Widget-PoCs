name: Deploy — K8S - Staging

on:
  workflow_dispatch:
  push:
    branches:
      - testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push testing image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      img_latest: ${{ steps.img.outputs.img_latest }}
      img_sha: ${{ steps.img.outputs.img_sha }}
      image_tag: ${{ steps.img.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The widget SDK is built into this image (see the Dockerfile's sdk stage) so
      # the deployment serves the widget it was built with. Without it the server
      # sends every embed to WIDGET_SDK_BASE_URL — a separately deployed widget
      # that can be older than the config it renders, and nothing reports it.
      #
      # A repository with no SDK_REPO_TOKEN yet still builds, without an SDK, so
      # adding this does not break deploys before the secrets exist. A token
      # *with* missing build inputs fails here instead of at docker build: the
      # widget throws at startup on a missing VITE_BASE_URL or
      # VITE_PUSHER_APP_KEY, so a build without them is worse than no build.
      - name: Resolve widget SDK build inputs
        id: sdk
        env:
          SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_PUSHER_APP_KEY: ${{ vars.VITE_PUSHER_APP_KEY }}
        run: |
          if [ -z "${SDK_REPO_TOKEN}" ]; then
            echo "::warning title=No widget SDK::SDK_REPO_TOKEN is not set, so this image ships no SDK and embeds will load WIDGET_SDK_BASE_URL."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "${VITE_BASE_URL}" ] || missing="${missing} VITE_BASE_URL"
          [ -n "${VITE_PUSHER_APP_KEY}" ] || missing="${missing} VITE_PUSHER_APP_KEY"
          if [ -n "${missing}" ]; then
            echo "::error title=Incomplete widget SDK configuration::Set these repository variables:${missing}"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check out the widget SDK
        if: steps.sdk.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SDK_REPO || 'Pair-AI-Platform/pair-widgets-preview' }}
          ref: ${{ vars.SDK_REF || 'main' }}
          token: ${{ secrets.SDK_REPO_TOKEN }}
          path: sdk-src
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image reference
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="testing-${SHORT_SHA}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMG_LATEST=$(echo "ghcr.io/${REPO}:testing-latest" | tr '[:upper:]' '[:lower:]')
          IMG_SHA=$(echo "ghcr.io/${REPO}:${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')

          {
            echo "image_tag=${IMAGE_TAG}"
            echo "img_latest=${IMG_LATEST}"
            echo "img_sha=${IMG_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.img_latest }}
            ${{ steps.img.outputs.img_sha }}
          platforms: linux/amd64
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
            VITE_PUSHER_APP_KEY=${{ vars.VITE_PUSHER_APP_KEY }}
            VITE_PUSHER_CLUSTER=${{ vars.VITE_PUSHER_CLUSTER }}
            VITE_PUSHER_HOST=${{ vars.VITE_PUSHER_HOST }}
            VITE_PUSHER_PORT=${{ vars.VITE_PUSHER_PORT }}
            VITE_PUSHER_FORCE_TLS=${{ vars.VITE_PUSHER_FORCE_TLS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.img.outputs.build_date }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.img.outputs.img_sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-security-scan
          path: trivy-results.sarif
          retention-days: 30