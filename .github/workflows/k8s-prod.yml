name: Deploy — K8S - producation

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push production image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      img_latest: ${{ steps.img.outputs.img_latest }}
      img_sha: ${{ steps.img.outputs.img_sha }}
      image_tag: ${{ steps.img.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image reference
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="production-${SHORT_SHA}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMG_LATEST=$(echo "ghcr.io/${REPO}:production-latest" | tr '[:upper:]' '[:lower:]')
          IMG_SHA=$(echo "ghcr.io/${REPO}:${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')

          {
            echo "image_tag=${IMAGE_TAG}"
            echo "img_latest=${IMG_LATEST}"
            echo "img_sha=${IMG_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.img_latest }}
            ${{ steps.img.outputs.img_sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.img.outputs.build_date }}


