name: Deploy — K8S - Production

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      img_latest: ${{ steps.img.outputs.img_latest }}
      img_sha: ${{ steps.img.outputs.img_sha }}
      image_tag: ${{ steps.img.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The widget SDK is built into this image (see the Dockerfile's sdk stage) so
      # production serves the widget it was built with, not a separately deployed
      # copy that can be older than the config it renders.
      #
      # Production reads its own *_PROD variables rather than sharing the staging
      # ones. Vite bakes these into the bundle, so an image is tied to one Pusher
      # environment: inheriting staging's key here would silently point every
      # production visitor's stream at the staging Pusher, and nothing would
      # report it. Missing values fail the build instead.
      - name: Resolve widget SDK build inputs
        id: sdk
        env:
          SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL_PROD }}
          VITE_PUSHER_APP_KEY: ${{ vars.VITE_PUSHER_APP_KEY_PROD }}
        run: |
          if [ -z "${SDK_REPO_TOKEN}" ]; then
            echo "::warning title=No widget SDK::SDK_REPO_TOKEN is not set, so this image ships no SDK and embeds will load WIDGET_SDK_BASE_URL."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "${VITE_BASE_URL}" ] || missing="${missing} VITE_BASE_URL_PROD"
          [ -n "${VITE_PUSHER_APP_KEY}" ] || missing="${missing} VITE_PUSHER_APP_KEY_PROD"
          if [ -n "${missing}" ]; then
            echo "::error title=Incomplete widget SDK configuration::Set these repository variables:${missing}"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check out the widget SDK
        if: steps.sdk.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SDK_REPO || 'Pair-AI-Platform/pair-widgets-preview' }}
          ref: ${{ vars.SDK_REF_PROD || 'main' }}
          token: ${{ secrets.SDK_REPO_TOKEN }}
          path: sdk-src
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image reference
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="production-${SHORT_SHA}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMG_LATEST=$(echo "ghcr.io/${REPO}:production-latest" | tr '[:upper:]' '[:lower:]')
          IMG_SHA=$(echo "ghcr.io/${REPO}:${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "img_latest=${IMG_LATEST}" >> "$GITHUB_OUTPUT"
          echo "img_sha=${IMG_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.img_latest }}
            ${{ steps.img.outputs.img_sha }}
          platforms: linux/amd64
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL_PROD }}
            VITE_PUSHER_APP_KEY=${{ vars.VITE_PUSHER_APP_KEY_PROD }}
            VITE_PUSHER_CLUSTER=${{ vars.VITE_PUSHER_CLUSTER_PROD }}
            VITE_PUSHER_HOST=${{ vars.VITE_PUSHER_HOST_PROD }}
            VITE_PUSHER_PORT=${{ vars.VITE_PUSHER_PORT_PROD }}
            VITE_PUSHER_FORCE_TLS=${{ vars.VITE_PUSHER_FORCE_TLS_PROD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.img.outputs.build_date }}
