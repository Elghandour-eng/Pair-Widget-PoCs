name: Deploy — K8S - Production

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      img_latest: ${{ steps.img.outputs.img_latest }}
      img_sha: ${{ steps.img.outputs.img_sha }}
      image_tag: ${{ steps.img.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The widget is built from sdk-src/ in this repository (see the Dockerfile's
      # sdk stage) so the image carries the widget its config was designed
      # against. Vite bakes the VITE_* values into the bundle and the widget
      # throws on a missing VITE_BASE_URL or VITE_PUSHER_APP_KEY, so a build
      # without them would ship a widget that cannot start. Rather than fail the
      # deploy, the build then skips the widget and the server falls back to
      # WIDGET_SDK_BASE_URL — loudly, in its own logs and in /api/health.
      #
      # Production reads its own variables. Sharing one set across environments
      # would point this environment's visitors at the other one's Pusher, with
      # the widget otherwise working and nothing reporting it.
      - name: Resolve widget build inputs
        id: sdk
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL_PROD }}
          VITE_PUSHER_APP_KEY: ${{ vars.VITE_PUSHER_APP_KEY_PROD }}
        run: |
          missing=""
          [ -n "${VITE_BASE_URL}" ] || missing="${missing} VITE_BASE_URL_PROD"
          [ -n "${VITE_PUSHER_APP_KEY}" ] || missing="${missing} VITE_PUSHER_APP_KEY_PROD"
          if [ -n "${missing}" ]; then
            echo "::warning title=No widget in this image::Set these repository variables to build it:${missing}"
            echo "build_sdk=0" >> "$GITHUB_OUTPUT"
          else
            echo "build_sdk=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image reference
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="production-${SHORT_SHA}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMG_LATEST=$(echo "ghcr.io/${REPO}:production-latest" | tr '[:upper:]' '[:lower:]')
          IMG_SHA=$(echo "ghcr.io/${REPO}:${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "img_latest=${IMG_LATEST}" >> "$GITHUB_OUTPUT"
          echo "img_sha=${IMG_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.img_latest }}
            ${{ steps.img.outputs.img_sha }}
          platforms: linux/amd64
          build-args: |
            BUILD_SDK=${{ steps.sdk.outputs.build_sdk }}
            VITE_BASE_URL=${{ vars.VITE_BASE_URL_PROD }}
            VITE_PUSHER_APP_KEY=${{ vars.VITE_PUSHER_APP_KEY_PROD }}
            VITE_PUSHER_CLUSTER=${{ vars.VITE_PUSHER_CLUSTER_PROD }}
            VITE_PUSHER_HOST=${{ vars.VITE_PUSHER_HOST_PROD }}
            VITE_PUSHER_PORT=${{ vars.VITE_PUSHER_PORT_PROD }}
            VITE_PUSHER_FORCE_TLS=${{ vars.VITE_PUSHER_FORCE_TLS_PROD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.img.outputs.build_date }}
